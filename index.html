<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trading Journal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: report tables laid out like the Excel Dashboard sheet — navy title bands, tinted column headers */
:root{
  color-scheme: light;
  --page:#f4f6f9; --surface:#ffffff; --ink:#111827; --ink-2:#4b5563; --muted:#8a93a3;
  --line:#e3e7ee; --band:#1f3864; --band-ink:#ffffff; --colhead:#dce6f1; --colhead-ink:#111827;
  --pos:#1a7f43; --neg:#c62828; --zero:#8a93a3;
  --good-fill:#d6efdc; --good-ink:#14592f; --bad-fill:#f7d7d7; --bad-ink:#8e1c1c;
  --border:rgba(17,24,39,.10); --hover:#f3f6fa;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0b0d11; --surface:#14171d; --ink:#eef1f5; --ink-2:#c4cad4; --muted:#8a93a3;
    --line:#262b34; --band:#1f3864; --band-ink:#ffffff; --colhead:#dce6f1; --colhead-ink:#111827;
    --pos:#4caf6e; --neg:#ef5350; --zero:#8a93a3;
    --good-fill:#4f6b2a; --good-ink:#ffffff; --bad-fill:#6e2626; --bad-ink:#ffffff;
    --border:rgba(255,255,255,.10); --hover:#1b1f27;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0b0d11; --surface:#14171d; --ink:#eef1f5; --ink-2:#c4cad4; --muted:#8a93a3;
  --line:#262b34; --band:#1f3864; --band-ink:#ffffff; --colhead:#dce6f1; --colhead-ink:#111827;
  --pos:#4caf6e; --neg:#ef5350; --zero:#8a93a3;
  --good-fill:#4f6b2a; --good-ink:#ffffff; --bad-fill:#6e2626; --bad-ink:#ffffff;
  --border:rgba(255,255,255,.10); --hover:#1b1f27;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
h1{font-size:22px;font-weight:650;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.sub .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sub .dot.ok{background:#16a34a}.sub .dot.err{background:#dc2626}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{background:var(--hover)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--band);outline-offset:2px}
.banner[hidden]{display:none!important}
.banner{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink-2);margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

.grid{display:grid;gap:16px;margin-bottom:16px;align-items:start}
.row1{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,.8fr)}
.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.row1{grid-template-columns:repeat(2,minmax(0,1fr))}.row1 .monthly{grid-column:1/-1}}
@media (max-width:700px){.row1,.row2{grid-template-columns:minmax(0,1fr)}}

.tbl{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;min-width:0}
.tbl .title{background:var(--band);color:var(--band-ink);font-weight:650;font-size:13.5px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tbl .title select{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.35);padding:2px 6px;font-size:12.5px}
.tbl .title select option{color:#111827}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:var(--colhead);color:var(--colhead-ink);font-size:12.5px;font-weight:650;padding:5px 10px;text-align:center;white-space:nowrap}
td{padding:4px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.m{text-align:right;padding-right:16px}
th.m{text-align:right;padding-right:16px}
tbody tr:hover td{background:var(--hover)}
tr.total td{font-weight:700;border-top:2px solid var(--ink-2);border-bottom:0}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--zero)}
.muted{color:var(--muted)}
td.good{background:var(--good-fill);color:var(--good-ink)}
td.bad{background:var(--bad-fill);color:var(--bad-ink)}
.summary td{text-align:left}
.summary td:last-child{text-align:right;font-weight:650}

.log .title{justify-content:space-between}
.log td{font-size:13px}
.log td.notes{white-space:normal;min-width:160px;text-align:left;color:var(--ink-2)}
.log th{cursor:pointer;user-select:none}
.log td.l,.log th.l{text-align:left}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--border)}
.pill.TP{color:var(--pos)}.pill.SL{color:var(--neg)}.pill.BE{color:var(--muted)}.pill.OPEN{color:var(--ink-2)}
a{color:var(--pos)}
.logwrap{max-height:560px;overflow:auto}
.log thead th{position:sticky;top:0;z-index:1}

.empty,.error{background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:40px 20px;text-align:center;color:var(--ink-2)}
.error{border-color:var(--neg)}
.empty h2,.error h2{color:var(--ink);font-size:16px;margin:0 0 6px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--hover);padding:1px 5px;border-radius:4px}
.drop{position:fixed;inset:0;background:rgba(31,56,100,.15);border:3px dashed var(--band);display:none;align-items:center;justify-content:center;font-size:18px;font-weight:600;z-index:10}
.drop.on{display:flex}
footer{margin-top:24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Trading Journal</h1>
      <div class="sub" id="status"><span class="dot"></span>Loading trades…</div>
    </div>
    <div class="tools">
      <button id="reload" type="button" title="Re-read trades.xlsx">↻ Refresh</button>
      <button id="pick" type="button" title="Preview a local file without uploading it">Open file…</button>
      <input type="file" id="file" accept=".xlsx,.xls" hidden>
      <button id="theme" type="button" title="Toggle light/dark">◐ Theme</button>
    </div>
  </header>

  <div class="banner" id="localBanner" hidden><span>Previewing a local file. This view isn't published; push the file to GitHub to update the site.</span><button id="backRemote" type="button">Back to published data</button></div>

  <div id="main"></div>
  <footer id="foot"></footer>
</div>
<div class="drop" id="drop">Drop your journal (.xlsx) to preview it</div>

<script>
/* ============================== CONFIG ============================== */
const CONFIG = {
  file: "trades.xlsx",                // workbook in the same folder as this page
  sheet: null,                        // sheet name, or null = first sheet
  rValues: { TP: 6, SL: -1, BE: 0 },  // R earned per result (match your Dashboard)
  screenshotFolder: "screenshots",    // image files named in the Screenshot column live here
  cumulativeYears: 3,                 // how many years the Cumulative R table shows
  refreshMinutes: 5
};
/* ==================================================================== */

const $ = s => document.querySelector(s);
const state = { trades: [], open: 0, source: "remote", year: null, sort: { key: "no", dir: -1 } };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ---------- theme ---------- */
try { const t = localStorage.getItem("tj-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
$("#theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const t = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("tj-theme", t); } catch (e) {}
};

/* ---------- formatting ---------- */
const fmtR = v => (v < 0 ? "-" : "") + Math.abs(v).toFixed(2) + "R";
const rCls = v => v > 0.0000001 ? "pos" : v < -0.0000001 ? "neg" : "zero";
const pct = v => v == null || !isFinite(v) ? "" : (v * 100).toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const bePct = () => Math.abs(CONFIG.rValues.SL) / (CONFIG.rValues.TP + Math.abs(CONFIG.rValues.SL));
$("#foot").innerHTML = `Reads <code id="srcName">${CONFIG.file}</code> on every load and every ${CONFIG.refreshMinutes} minutes. TP = +${CONFIG.rValues.TP}R, SL = ${CONFIG.rValues.SL}R, BE = 0R. Win rate = wins ÷ closed trades. Rows with a date but no result count as open trades.`;

/* ---------- parsing ---------- */
const ALIASES = {
  no: ["trade no", "trade #", "#", "no", "trade"], date: ["date"], time: ["time"], market: ["market", "symbol", "pair", "instrument"],
  direction: ["direction", "side"], session: ["session"], setup: ["setup", "strategy"], result: ["result", "outcome"],
  notes: ["notes", "note", "comments"], screenshot: ["screenshot", "chart", "link", "image"]
};
function toDate(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === "number") { const p = XLSX.SSF.parse_date_code(v); return p ? new Date(p.y, p.m - 1, p.d) : null; }
  const m = String(v).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  const d = new Date(v); return isNaN(d) ? null : d;
}
function timeParts(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date) return [v.getHours(), v.getMinutes()];
  if (typeof v === "number") { const mins = Math.round((v % 1) * 1440); return [Math.floor(mins / 60) % 24, mins % 60]; }
  const m = String(v).match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i); if (!m) return null;
  let h = +m[1]; if (m[3]) { const pm = /pm/i.test(m[3]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
  return [h, +m[2]];
}
function parseWorkbook(buf) {
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const name = (CONFIG.sheet && wb.SheetNames.find(n => n.toLowerCase() === CONFIG.sheet.toLowerCase())) || wb.SheetNames[0];
  const ws = wb.Sheets[name];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  const hi = rows.slice(0, 15).findIndex(r => { const h = r.map(x => String(x ?? "").trim().toLowerCase()); return h.includes("date") && h.includes("result"); });
  if (hi < 0) throw new Error(`Couldn't find a header row with "Date" and "Result" on sheet "${name}".`);
  const hdr = rows[hi].map(h => String(h ?? "").trim().toLowerCase()), col = {};
  for (const [k, names] of Object.entries(ALIASES)) { const i = hdr.findIndex(h => names.includes(h)); if (i >= 0) col[k] = i; }
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const g = (r, k) => col[k] == null ? null : r[col[k]];
  const rv = Object.fromEntries(Object.entries(CONFIG.rValues).map(([k, v]) => [k.toUpperCase(), v]));
  const out = []; let open = 0;
  rows.slice(hi + 1).forEach((r, i) => {
    const d = toDate(g(r, "date")); if (!d) return;
    const res = String(g(r, "result") ?? "").trim().toUpperCase();
    const isOpen = !res || res === "OPEN";
    if (!isOpen && !(res in rv)) return;
    if (isOpen) open++;
    const excelRow = range.s.r + hi + 2 + i;
    let shot = null;
    if (col.screenshot != null) {
      const cell = ws[XLSX.utils.encode_cell({ r: excelRow - 1, c: range.s.c + col.screenshot })];
      const sv = String(g(r, "screenshot") ?? "").trim();
      shot = cell?.l?.Target || (/^https?:\/\//i.test(sv) ? sv
        : /\.(png|jpe?g|gif|webp)$/i.test(sv) ? CONFIG.screenshotFolder + "/" + encodeURIComponent(sv.replace(/^.*[\\/]/, "")) : null);
    }
    const t = timeParts(g(r, "time"));
    const dirRaw = String(g(r, "direction") ?? "").trim().toUpperCase();
    out.push({
      no: Number(g(r, "no")) || out.length + 1,
      date: new Date(d.getFullYear(), d.getMonth(), d.getDate(), t ? t[0] : 0, t ? t[1] : 0), hasTime: !!t,
      market: String(g(r, "market") ?? "").trim().toUpperCase() || "—",
      direction: /^(BUY|LONG|B)$/.test(dirRaw) ? "BUY" : /^(SELL|SHORT|S)$/.test(dirRaw) ? "SELL" : (dirRaw || "—"),
      session: String(g(r, "session") ?? "").trim() || "—",
      setup: String(g(r, "setup") ?? "").trim() || "—",
      result: isOpen ? "OPEN" : res, r: isOpen ? 0 : rv[res], closed: !isOpen,
      notes: g(r, "notes") ?? "", shot
    });
  });
  out.sort((a, b) => a.date - b.date || a.no - b.no);
  return { trades: out, open };
}

/* ---------- loading ---------- */
async function loadRemote() {
  setStatus("Loading trades…");
  try {
    const res = await fetch(CONFIG.file + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(`Couldn't load ${CONFIG.file} (HTTP ${res.status}). Make sure it's committed next to index.html.`);
    const lm = res.headers.get("last-modified");
    apply(parseWorkbook(await res.arrayBuffer()));
    state.source = "remote"; $("#localBanner").hidden = true; $("#srcName").textContent = CONFIG.file;
    setStatus(`${state.trades.length} trades · ${lm ? "file updated " + new Date(lm).toLocaleString() : "loaded " + new Date().toLocaleTimeString()}`, "ok");
  } catch (err) {
    setStatus("Couldn't load data", "err");
    if (location.protocol === "file:") err = new Error("Browsers block reading files when the page is opened straight from disk. Use “Open file…” to preview, or view the published GitHub Pages site.");
    $("#main").innerHTML = `<div class="error"><h2>Data didn't load</h2><div>${esc(err.message)}</div></div>`;
  }
}
function loadLocal(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      apply(parseWorkbook(new Uint8Array(fr.result)));
      state.source = "local"; $("#localBanner").hidden = false; $("#srcName").textContent = file.name;
      setStatus(`${state.trades.length} trades · local preview of ${file.name}`, "ok");
    } catch (err) { $("#main").innerHTML = `<div class="error"><h2>Couldn't read that file</h2><div>${esc(err.message)}</div></div>`; }
  };
  fr.readAsArrayBuffer(file);
}
function apply({ trades, open }) {
  state.trades = trades; state.open = open;
  const years = yearsInData();
  if (!years.includes(state.year)) state.year = years.length ? years[years.length - 1] : new Date().getFullYear();
  render();
}
function setStatus(t, kind) { $("#status").innerHTML = `<span class="dot ${kind || ""}"></span>${esc(t)}`; }
$("#reload").onclick = () => { if (state.source === "remote") loadRemote(); };
$("#backRemote").onclick = () => loadRemote();
$("#pick").onclick = () => $("#file").click();
$("#file").onchange = e => { if (e.target.files[0]) loadLocal(e.target.files[0]); e.target.value = ""; };
let dragN = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragN++; $("#drop").classList.add("on"); });
addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; $("#drop").classList.remove("on"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragN = 0; $("#drop").classList.remove("on"); const f = e.dataTransfer.files[0]; if (f) loadLocal(f); });
setInterval(() => { if (state.source === "remote" && !document.hidden) loadRemote(); }, CONFIG.refreshMinutes * 60000);

/* ---------- stats ---------- */
function stats(ts) {
  const c = ts.filter(t => t.closed);
  const wins = c.filter(t => t.result === "TP").length, losses = c.filter(t => t.result === "SL").length, be = c.filter(t => t.result === "BE").length;
  const gw = c.filter(t => t.r > 0).reduce((s, t) => s + t.r, 0), gl = -c.filter(t => t.r < 0).reduce((s, t) => s + t.r, 0);
  let curW = 0, curL = 0, maxW = 0, maxL = 0;
  for (const t of c) {
    if (t.result === "TP") { curW++; curL = 0; } else if (t.result === "SL") { curL++; curW = 0; }
    maxW = Math.max(maxW, curW); maxL = Math.max(maxL, curL);
  }
  return { n: c.length, wins, losses, be, net: gw - gl, gw, gl,
    winRate: c.length ? wins / c.length : null, exp: c.length ? (gw - gl) / c.length : null,
    pf: gl > 0 ? gw / gl : (gw > 0 ? Infinity : null), maxW, maxL };
}
const yearsInData = () => [...new Set(state.trades.filter(t => t.closed).map(t => t.date.getFullYear()))].sort();

/* ---------- render ---------- */
function render() {
  const main = $("#main");
  if (!state.trades.length) {
    main.innerHTML = `<div class="empty"><h2>No trades yet</h2><div>Log your first trade in <code>${esc(CONFIG.file)}</code> (Date and Result), save, and push it to GitHub.</div></div>`;
    return;
  }
  main.innerHTML = `
    <section class="grid row1">
      <div class="tbl monthly" id="tMonthly"></div>
      <div class="tbl" id="tCum"></div>
      <div class="tbl" id="tSummary"></div>
    </section>
    <section class="grid row2">
      <div class="tbl" id="tDir"></div>
      <div class="tbl" id="tMarket"></div>
      <div class="tbl" id="tSession"></div>
    </section>
    <section class="tbl log" id="tLog"></section>`;
  renderMonthly(); renderCumulative(); renderSummary();
  renderGroup("#tDir", "Performance by Direction (all-time)", "Direction", "direction", ["BUY", "SELL"]);
  renderGroup("#tMarket", "Performance by Market (all-time)", "Market", "market");
  renderGroup("#tSession", "Performance by Session (all-time)", "Session", "session", ["Asia", "London", "New York"]);
  renderLog();
}
const dash = n => n ? n : "-";
function renderMonthly() {
  const years = yearsInData(); const y = state.year;
  const ts = state.trades.filter(t => t.date.getFullYear() === y);
  const be = bePct();
  const rows = MONTHS.map((m, i) => {
    const s = stats(ts.filter(t => t.date.getMonth() === i));
    const wr = s.n ? `<td class="${s.winRate >= be ? "good" : "bad"}">${pct(s.winRate)}</td>` : `<td></td>`;
    return `<tr><td>${m}</td><td>${dash(s.n)}</td><td>${dash(s.wins)}</td><td>${dash(s.losses)}</td>${wr}<td class="m ${rCls(s.net)}">${fmtR(s.net)}</td><td class="muted">${pct(be)}</td></tr>`;
  }).join("");
  const s = stats(ts);
  const sel = years.length > 1 ? `<select id="yearSel" aria-label="Year">${years.map(v => `<option ${v === y ? "selected" : ""}>${v}</option>`).join("")}</select>` : "";
  $("#tMonthly").innerHTML = `<div class="title"><span>Monthly Performance - ${y}</span>${sel}</div><div class="scroll"><table>
    <thead><tr><th>Month</th><th>Trades</th><th>Wins</th><th>Losses</th><th>Win Rate</th><th class="m">Net R</th><th>B/E Win %</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr class="total"><td>Total</td><td>${s.n}</td><td>${s.wins}</td><td>${s.losses}</td><td>${pct(s.winRate)}</td><td class="m ${rCls(s.net)}">${fmtR(s.net)}</td><td></td></tr></tfoot>
  </table></div>`;
  const ys = $("#yearSel"); if (ys) ys.onchange = () => { state.year = +ys.value; renderMonthly(); };
}
function renderCumulative() {
  const data = yearsInData(); const last = data.length ? data[data.length - 1] : new Date().getFullYear();
  const years = []; for (let y = last; years.length < CONFIG.cumulativeYears; y--) years.push(y);
  const now = new Date();
  const cols = years.map(y => {
    const ts = state.trades.filter(t => t.closed && t.date.getFullYear() === y);
    const lastMonth = y === now.getFullYear() ? now.getMonth() : 11;   // leave future months blank
    let run = 0;
    return MONTHS.map((_, i) => { run += ts.filter(t => t.date.getMonth() === i).reduce((s, t) => s + t.r, 0); return i <= lastMonth ? run : null; });
  });
  $("#tCum").innerHTML = `<div class="title"><span>Cumulative R by Month</span></div><div class="scroll"><table>
    <thead><tr><th>Month</th>${years.map(y => `<th class="m">${y}</th>`).join("")}</tr></thead>
    <tbody>${MONTHS.map((m, i) => `<tr><td>${m}</td>${cols.map(c => c[i] == null ? `<td></td>` : `<td class="m ${rCls(c[i])}">${fmtR(c[i])}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}
function renderSummary() {
  const s = stats(state.trades), be = bePct();
  const pf = s.pf == null ? "—" : s.pf === Infinity ? "∞" : s.pf.toFixed(2) + "x";
  const rows = [
    ["Closed Trades", s.n], ["Wins (TP)", s.wins], ["Losses (SL)", s.losses], ["Breakeven", s.be],
    ["Win Rate", pct(s.winRate) || "—", s.winRate == null ? "" : s.winRate >= be ? "good" : "bad"],
    ["Break-even Win Rate", pct(be), "pos"],
    ["Total R", fmtR(s.net), rCls(s.net)], ["Expectancy (Avg R / trade)", s.exp == null ? "—" : fmtR(s.exp), s.exp == null ? "" : rCls(s.exp)],
    ["Profit Factor", pf], ["Longest Win Streak", s.maxW], ["Longest Loss Streak", s.maxL], ["Open Trades", state.open]
  ];
  $("#tSummary").innerHTML = `<div class="title"><span>Performance Summary (all-time)</span></div><table class="summary"><tbody>
    ${rows.map(([k, v, c]) => `<tr><td>${k}</td><td class="${c || ""}">${v}</td></tr>`).join("")}</tbody></table>`;
}
function renderGroup(sel, title, label, key, order) {
  const closed = state.trades.filter(t => t.closed);
  let keys = [...new Set(closed.map(t => t[key]))];
  if (order) keys.sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99) || String(a).localeCompare(b));
  else keys.sort((a, b) => closed.filter(t => t[key] === b).length - closed.filter(t => t[key] === a).length || String(a).localeCompare(b));
  const rows = keys.map(k => {
    const s = stats(closed.filter(t => t[key] === k));
    return `<tr><td>${esc(k)}</td><td>${s.n}</td><td>${s.wins}</td><td>${s.losses}</td><td>${pct(s.winRate)}</td><td class="m ${rCls(s.net)}">${fmtR(s.net)}</td></tr>`;
  }).join("");
  $(sel).innerHTML = `<div class="title"><span>${title}</span></div><div class="scroll"><table>
    <thead><tr><th>${label}</th><th>Trades</th><th>Wins</th><th>Losses</th><th>Win Rate</th><th class="m">Net R</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="6" class="muted">No closed trades yet</td></tr>`}</tbody></table></div>`;
}

/* ---------- trade log ---------- */
const LEFT = ["market", "direction", "session", "setup", "notes", "shot"];
const COLS = [
  ["no", "Trade No", t => t.no], ["date", "Date", t => ymd(t.date)], ["time", "Time", t => t.hasTime ? pad(t.date.getHours()) + ":" + pad(t.date.getMinutes()) : ""],
  ["market", "Market", t => esc(t.market)], ["direction", "Direction", t => esc(t.direction)], ["session", "Session", t => esc(t.session)],
  ["setup", "Setup", t => esc(t.setup)], ["result", "Result", t => `<span class="pill ${t.result}">${t.result === "OPEN" ? "Open" : esc(t.result)}</span>`],
  ["r", "R", t => t.closed ? `<span class="${rCls(t.r)}">${fmtR(t.r)}</span>` : ""], ["notes", "Notes", t => esc(t.notes)],
  ["shot", "Screenshot", t => t.shot ? `<a href="${esc(t.shot)}" target="_blank" rel="noopener">View ↗</a>` : ""]
];
function renderLog() {
  const { key, dir } = state.sort;
  const val = (t, k) => k === "time" ? (t.hasTime ? t.date.getHours() * 60 + t.date.getMinutes() : null) : t[k];
  const rows = [...state.trades].sort((a, b) => { const x = val(a, key), y = val(b, key); if (x == null || x === "") return 1; if (y == null || y === "") return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  $("#tLog").innerHTML = `<div class="title"><span>Trade Log</span><span style="font-weight:400;font-size:12px;opacity:.85">Click a column to sort</span></div>
    <div class="logwrap"><table>
    <thead><tr>${COLS.map(([k, l]) => `<th data-k="${k}" class="${LEFT.includes(k) ? "l" : ""}">${l}${k === key ? (dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(t => `<tr>${COLS.map(([k, , f]) => `<td class="${k === "notes" ? "notes" : LEFT.includes(k) ? "l" : ""}">${f(t)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("#tLog thead").onclick = e => { const th = e.target.closest("th"); if (!th) return; const k = th.dataset.k;
    state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (["no", "date", "r"].includes(k) ? -1 : 1) }; renderLog(); };
}

loadRemote();
</script>
